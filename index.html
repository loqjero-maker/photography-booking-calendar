<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Multi-Timezone Digital Clock</title>
    <link rel="stylesheet" href="styles.css">
</head>
<body>
    <div class="clock-container">
        <h1>Global Time Zones</h1>
        
        <div class="clocks-grid">
            <div class="clock-card">
                <h2>New York (EST)</h2>
                <div class="digital-clock" id="ny-clock">00:00:00</div>
                <p class="timezone">UTC -5</p>
            </div>

            <div class="clock-card">
                <h2>London (GMT)</h2>
                <div class="digital-clock" id="london-clock">00:00:00</div>
                <p class="timezone">UTC +0</p>
            </div>

            <div class="clock-card">
                <h2>Paris (CET)</h2>
                <div class="digital-clock" id="paris-clock">00:00:00</div>
                <p class="timezone">UTC +1</p>
            </div>

            <div class="clock-card">
                <h2>Dubai (GST)</h2>
                <div class="digital-clock" id="dubai-clock">00:00:00</div>
                <p class="timezone">UTC +4</p>
            </div>

            <div class="clock-card">
                <h2>Tokyo (JST)</h2>
                <div class="digital-clock" id="tokyo-clock">00:00:00</div>
                <p class="timezone">UTC +9</p>
            </div>

            <div class="clock-card">
                <h2>Sydney (AEDT)</h2>
                <div class="digital-clock" id="sydney-clock">00:00:00</div>
                <p class="timezone">UTC +11</p>
            </div>

            <div class="clock-card">
                <h2>Los Angeles (PST)</h2>
                <div class="digital-clock" id="la-clock">00:00:00</div>
                <p class="timezone">UTC -8</p>
            </div>

            <div class="clock-card">
                <h2>Singapore (SGT)</h2>
                <div class="digital-clock" id="singapore-clock">00:00:00</div>
                <p class="timezone">UTC +8</p>
            </div>
        </div>
    </div>

    <script src="script.js"></script>
</body>
</html>
